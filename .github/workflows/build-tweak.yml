name: Build FaceID2D

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Install Theos dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y clang make perl
      git clone --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
  - name: Build tweak
    run: |
      export THEOS="$GITHUB_WORKSPACE/theos"
      make package FINALPACKAGE=1
  - name: Upload packages
    uses: actions/upload-artifact@v4
    with:
      name: FaceID2D-build
      path: packages/*.deb
      if-no-files-found: error
